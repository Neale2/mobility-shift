<!doctype html>
<html lang="en">
    <head>
        <script
            src="https://browser.sentry-cdn.com/10.8.0/bundle.tracing.replay.feedback.min.js"
            integrity="sha384-Yy2UXIFrWRfe56w1BuJ8/pgltHwWyYP4Q7dYKueJ/c6RG8B/bPJmGv+TBTQSuTSv"
            crossorigin="anonymous"></script>
        <script>
            Sentry.init({
                dsn: "https://4f1b680b2af32bf11c468fbd4f104bea@o4509970654560256.ingest.de.sentry.io/4509970669895760"
            });
        </script>
        {% block title %}
        <title>Dashboard</title>
        {% endblock %}
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- Add additional CSS in static file -->
        {% load static %}
        <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
        <link rel="icon" type="image/png" href="{% static 'images/favicon/favicon-96x96.png' %}" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon/favicon.svg' %}" />
        <link rel="shortcut icon" href="{% static 'images/favicon/favicon.ico' %}" />
        <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/favicon/apple-touch-icon.png' %}" />
        <meta name="apple-mobile-web-app-title" content="Swap One" />
        <link rel="manifest" href="{% static 'images/favicon/site.webmanifest' %}" />
        <script>
            //grams of CO2e
            const TreePerYear = 54352;
            const Targets = [
                5000, 10000, 20000, 40000, 60000, 80000, 100000, 150000, 200000, 250000, 500000, 750000, 1000000,
                2500000, 5000000, 10000000, 25000000, 50000000, 100000000, 250000000, 500000000, 1000000000, 2500000000,
                5000000000, 10000000000, 25000000000, 50000000000, 100000000000, 250000000000, 500000000000,
                1000000000000
            ];

            const UserDistanceTargets = [
              [10000, "City Loop", "Your first 10km swapped for a cleaner commute!"],
              [35000, "Nelson to Richmond", "35km swapped! Connecting communities with low-carbon travel."],
              [80000, "Coastline Cruiser", "80km of clean journeys logged across our region."],
              [175000, "Great Taste Trailblazer", "175km swapped—matching the full length of the Great Taste Trail!"],
              [350000, "Cook Strait Crossing", "350km logged! Far enough to cross Cook Strait and back clean."],
              [750000, "Southern Alps Rover", "750km of low-carbon travel across the South Island."],
              [1500000, "Tour of Aotearoa", "1,500km! You’ve travelled the length of New Zealand clean."]
            ];

            const UserTripTargets = [
              [1, "The Spark", "Your low-carbon journey begins with a single swap!"],
              [5, "Rhythm Maker", "5 swaps logged—you’re building a real low-carbon routine."],
              [12, "Routine Master", "12 swaps in! Choosing cleaner travel is second nature."],
              [25, "Quarter Century", "25 swaps logged! Inspiring momentum across our community."],
              [50, "Golden Swapper", "50 swaps! A massive milestone for sustainable commuting."],
              [100, "Century Club", "100 swaps! You are actively reshaping how our region moves."],
              [200, "Swap Legend", "200+ swaps! An undisputed champion for local climate action."]
            ];

            const UserSavingsTargets = [
              [5000, "Fresh Breeze", "5kg of CO₂e avoided! Our streets breathe a little easier."],
              [15000, "Canopy Builder", "15kg of CO₂e saved—the equivalent of a growing native tree."],
              [35000, "Clean Sky Defender", "35kg of CO₂e cut! Keeping the horizon bright and clear."],
              [75000, "Heavy Lifter", "75kg of CO₂e avoided! Real weight lifted off our atmosphere."],
              [150000, "Climate Cooler", "150kg of emissions eliminated through everyday swaps."],
              [300000, "Atmosphere Guardian", "300kg of greenhouse gases prevented from entering the air."],
              [500000, "Half-Tonne Hero", "500kg of CO₂e saved! Half a tonne of pure climate impact."]
            ];

            var next_employer = "{{ next_employer }}";
            var emissions_to_pass = {{ emissions_to_pass }};
            var rank = {{ rank }};
            var trip_count = {{ trip_count }};
            var t_trip_count = {{ t_trip_count }};
            var distance = {{ distance }};
            var userName = "{{ user.name }}";
            var userSaved = {{ user.emissions_saved }};
            var employerName = "{{ employer.name }}";
            var employerSaved = {{ employer.emissions_saved }};
            var allSaved = {{ all.emissions_saved }};

            var currDistance = 0;
            var targetDistance = UserDistanceTargets[0];
            function userTargets (distance, trip_count, userSaved) {
                UserDistanceTargets.forEach(function (target, index) {
                    if (target[0] <= distance) {
                        targetDistance = UserDistanceTargets[index + 1] ?? target;
                        currDistance = target;
                    }
                });

                var currTrips = 0;
                var targetTrips = UserTripTargets[0];

                UserTripTargets.forEach(function (target, index) {
                    if (target[0] <= trip_count) {
                        targetTrips = UserTripTargets[index + 1] ?? target;
                        currTrips = target;
                    }
                });

                var currSaved = 0;
                var targetSaved = UserSavingsTargets[0];

                UserSavingsTargets.forEach(function (target, index) {
                    if (target[0] <= userSaved) {
                        targetSaved = UserSavingsTargets[index + 1] ?? target;
                        currSaved = target;
                    }
                });
                return [currDistance, targetDistance, currTrips, targetTrips, currSaved, targetSaved];
            }
            var userTargetList = userTargets(distance, trip_count, userSaved);
            console.log(userTargetList)
            var prevGoalEmp = 0;
            var targetGoalEmp = 5000;

            Targets.forEach(function (target, index) {
                if (target <= employerSaved) {
                    targetGoalEmp = Targets[index + 1];
                    prevGoalEmp = target;
                }
            });

            addEventListener("DOMContentLoaded", function () {


                var parent = document.getElementById("emissions");

                parent.innerHTML += `<div class=yroundbox><p class="badgetext">Swap One impact: <span class="bignumber">${Math.round(allSaved/1000).toLocaleString('en-US')}kg</span> CO₂ saved across <span class="bignumber">${t_trip_count.toLocaleString('en-US')}</span> trips!</p></div><br>`

                var badgepanel = `<div id="badgepanel" class="badgepanel"> <div class="threebox">`

                var userValue = `${(userSaved/1000).toFixed(1)} / ${userTargetList[3][0]}`
                var incomplete = 'incomplete'
                if (userTargetList[5] == userTargetList[4]) {
                    userValue = (userSaved / 1000).toFixed(1);
                    incomplete = "";
                }
                badgepanel += `

                        <div class="badgebox" id="emissions_b">
                            <img class="badge ${incomplete}" src="{% static 'images/Badges/' %}Savings_${userTargetList[5][0]}.png" />
                            <p class="badgetext">${userValue}kg</p>
                        </div>
                `

                var userValue = `${trip_count} / ${userTargetList[3][0]}`
                var incomplete = 'incomplete'
                if (userTargetList[3] == userTargetList[2]) {
                    userValue = trip_count;
                    incomplete = "";
                }
                badgepanel += `
                        <div class="badgebox" id="trips">
                            <img class="badge ${incomplete}" src="{% static 'images/Badges/' %}Trips_${userTargetList[3][0]}.png" />
                            <p class="badgetext">${userValue} trips</p>
                        </div>
                `

                var userValue = `${(distance / 1000).toFixed(1)} / ${userTargetList[1][0] / 1000}`
                var incomplete = 'incomplete'
                if (userTargetList[1] == userTargetList[0]) {
                    userValue = (distance / 1000).toFixed(1);
                    incomplete = "";
                }
                badgepanel += `
                        <div class="badgebox" id="distance">
                            <img class="badge ${incomplete}" src="{% static 'images/Badges/' %}Distance_${userTargetList[1][0]}.png" />
                            <p class="badgetext">${userValue}km</p>
                        </div>

                `
                parent.innerHTML = parent.innerHTML + badgepanel + `</div>
                </div>`




                if (employerName != "None / Other / Prefer Not To Say") {
                    if (rank == 1) {
                        parent.innerHTML =
                            parent.innerHTML +
                            `
                             <div class="emissionsbox">
                                 <h4>${employerName}</h4>
                                 <div class="graphback">
                                     <div class="graphfront" style="width:${((employerSaved / employerSaved) * 100).toFixed(1)}%;"></div>
                                     <span class="graphlabel" style="left:calc(0% - 200px);">0.0kg</span>
                                     <span class="graphlabel" style="left:calc(100% - 200px);">${(employerSaved / 1000).toFixed(1)}kg</span>

                                 </div>
                                 <p>${employerName} is in first place, with the most amount of emissions saved!</p>
                                 </div>
                             `;

                    } else {
                        parent.innerHTML =
                            parent.innerHTML +
                            `
                             <div class="emissionsbox">
                                 <h4>${employerName}</h4>
                                 <div class="graphback">
                                     <div class="graphfront" style="width:${((employerSaved / (employerSaved + emissions_to_pass + 1)) * 100).toFixed(1)}%;"></div>
                                     <span class="graphlabel" style="left:calc(0% - 200px);">0.0kg</span>
                                     <span class="graphlabel" style="left:calc(${((employerSaved / (employerSaved + emissions_to_pass + 1)) * 100).toFixed(1)}% - 200px);">${(employerSaved / 1000).toFixed(1)}kg</span>
                                     <span class="graphlabel" style="left:calc(100% - 200px);">${((employerSaved + emissions_to_pass) / 1000).toFixed(1)}kg</span>

                                 </div>
                                 <p>${employerName} is in ${rank+getOrdinalSuffix(rank)} place, just ${(emissions_to_pass/1000).toFixed(1)}kg behind ${next_employer}!</p>
                                 </div>
                             `;
                    }
                }
                const queryString = window.location.search;
                const urlParams = new URLSearchParams(queryString);
                if (urlParams.get('confirm_edit') == "true") {
                    niceAlert("Swap One", "Successfully edited profile!", [['OK!', true, "closePopup('edited')"]], "edited");
                    const url = new URL(window.location.href);
                    url.searchParams.delete('confirm_edit');
                    window.history.replaceState({}, '', url.pathname + url.search + url.hash);
                } else if (urlParams.get('just_logged_yes') == "true") {

                    var oldBlock = userTargets(urlParams.get('distance'), urlParams.get('trip_count'), urlParams.get('emissions_saved'));
                    var newBadges = [];
                    oldBlock.forEach((target, index) => {
                        if (index % 2 == 0) {
                            console.log(target)
                            console.log(userTargetList[index])
                            if (target != userTargetList[index]) {
                                newBadges.push(index / 2);
                            }
                        }
                    });
                    niceAlert("Trip Logged!", "Would you like to log another trip with different distances or modes of transport?", [["Log Another", false, "logAnother()"], ["I'm Done!", true, "closePopup('logged')"]], "logged");
                    newBadges.forEach((badgeid, index) => {
                        var badgelist = ["Distance", "Trips", "Savings"];
                        if (badgeid == 0) {
                            match = UserDistanceTargets.find(([dist]) => dist === userTargetList[0][0])
                        } else if (badgeid == 1) {
                            match = UserTripTargets.find(([dist]) => dist === userTargetList[2][0])
                        } else {
                            match = UserSavingsTargets.find(([dist]) => dist === userTargetList[4][0])
                        }

                        console.log(match)


                        niceAlert(`You've unlocked the ${match[1]} badge!`, `${match[2]}<br><img class="popupbadge" src="{% static 'images/Badges/' %}${badgelist[badgeid]}_${match[0]}.png">`, [["Great!", true, `closePopup('${badgeid}')`]], badgeid);
                    });
                    console.log(newBadges)


                    const url = new URL(window.location.href);
                    url.searchParams.delete('just_logged_yes');
                    url.searchParams.delete('distance');
                    url.searchParams.delete('trip_count');
                    url.searchParams.delete('emissions_saved');
                    window.history.replaceState({}, '', url.pathname + url.search + url.hash);
                }
            });

            function navToggle() {
                var x = document.getElementById("navlinks");
                var y = document.getElementById("navbutton");
                if (x.style.display === "flex") {
                    console.log("a");
                    x.style.display = "none";
                    y.innerHTML = "☰";
                } else {
                    x.style.display = "flex";
                    y.innerHTML = "✕";
                    console.log("b");
                    console.log("b");
                }
            }

            function getOrdinalSuffix(num) {
              const j = num % 10;
              const k = num % 100;

              if (k >= 11 && k <= 13) {
                return "th";
              }
              if (j === 1) {
                return "st";
              }
              if (j === 2) {
                return "nd";
              }
              if (j === 3) {
                return "rd";
              }

              return "th";
            }
        </script>
    </head>
    <body>
        <header>
            <div class="visdiv">
                <button id="navbutton" onclick="navToggle()">☰</button>
                <div class="headerbox">
                    <a href="https://www.swapone.nz"
                        ><img
                            alt="Swap One logo (link to main website)"
                            class="logo"
                            src="{% static 'images/cool_logo.png' %}"
                    /></a>
                </div>
            </div>
            <div id="navlinks">
                <a class="button" href="/edit/{{ user.uuid }}">Edit Profile</a>
                <a class="button" href="/dash/{{ user.uuid }}">View Dashboard</a>
                <a class="button" href="/unsubscribe/{{ user.uuid }}">Unsubscribe</a>
            </div>
        </header>
        <main>
            <h1>Dashboard</h1>
            <div class="content" id="emissions">
                <div class="cutoff"></div>
            </div>
            <div class="cutoff"></div>
            <hr class="divider" />
            <div class="content"><div class="article">{{ post.formatted_markdown|safe }}</div></div>
        </main>
        <footer>
            <div class="logobox">
                <a href="https://www.nelsontasmanclimateforum.nz/"
                    ><img
                        alt="Nelson Tasman Climate Forum logo (link to website)"
                        class="logoimg"
                        src="{% static 'images/Logos/ntcf.png' %}"
                /></a>
                <a href="https://missionzero.nz/"
                    ><img
                        alt="Mission Zero logo (link to website)"
                        class="logoimg"
                        src="{% static 'images/Logos/missionzero.png' %}"
                /></a>
                <a href="https://www.nelsust.org.nz/"
                    ><img
                        alt="Nelsust logo (link to website)"
                        class="logoimg"
                        src="{% static 'images/Logos/nelsust.png' %}"
                /></a>
                <a href="https://www.nelson.govt.nz/"
                    ><img
                        alt="Nelson City Council logo (link to website)"
                        class="logoimg"
                        src="{% static 'images/Logos/ncc.png' %}"
                /></a>
            </div>
            <p>
                <b>
                    Made with love by Arturo Neale |
                    <a
                        href="https://docs.google.com/document/d/16ZJs5ThK508UCH08u0rqlp89AmkNzo0Klvcf2od-W18/edit?usp=sharing"
                        >T&Cs / Privacy</a
                    >
                </b>
            </p>
        </footer>
        <script data-collect-dnt="true" async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
        <script>
            function closePopup(id) {
                document.getElementById(`popup${id}`).remove();
            }

            function logAnother() {
                window.location.href = "/yes/{{ user.uuid }}?from_dash_popup=true";
            }

            //button input: list for buttons [[<text>, <isPrimary (t/f)>, <functionStr>]]
            function niceAlert(title, text, buttons, id) {
                let buttonString = "";
                buttons.forEach((button) => {
                    buttonString += '<button class="button centered';
                    if (!button[1]) {
                        buttonString += " secondary";
                    }
                    buttonString += `" onclick="${button[2]}">${button[0]}</button>`;
                });

                document.querySelector("body").innerHTML += `
                    <div class="popupbg" id="popup${id}">
                        <div class="popup">
                            <div class="popupheader"><h2>${title}</h2></div>
                            <div class="popuptext">${text}</div>
                                <div class="popupbuttonbox">${buttonString}</div>
                        </div>
                    </div>`;
            }
        </script>
    </body>
</html>
